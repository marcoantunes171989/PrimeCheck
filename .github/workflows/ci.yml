name: PrimeCheck CI

on:
  push:
    branches: [homologacao-local-validacao, homologacao, main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and build
        run: npm run build

      - name: Verify hierarchy display
        run: npm run verify:hierarchy

      - name: Verify Product Store architecture
        run: npm run verify:product-store

      - name: Verify typography layout
        run: npm run verify:typography

      - name: Verify responsive layout
        run: npm run verify:responsive

      - name: Verify dashboard navigation
        run: npm run verify:dashboard-navigation

      - name: Verify authentication gate
        run: npm run verify:auth-gate

      - name: Verify NFC-e product search filters
        run: npm run verify:nfce-short-cprod

      - name: Verify NFC-e XML tag search
        run: npm run verify:nfce-xml-search

      - name: Verify NFC-e menu label
        run: npm run verify:nfce-menu-label

      - name: Verify NFC-e formatted XML view
        run: npm run verify:nfce-xml-format

      - name: Verify build SHA and served bundle
        run: npm run verify:build-info

      - name: Verify simple local validation flow
        run: npm run verify:local-served-script

  local-preview:
    name: Windows validar-local.cmd smoke
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Fetch production and homologation refs
        shell: powershell
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main +refs/heads/homologacao-local-validacao:refs/remotes/origin/homologacao-local-validacao +refs/heads/production-release:refs/remotes/origin/production-release
          if ($LASTEXITCODE -ne 0) {
            throw "Nao foi possivel buscar as referencias de versao."
          }

      - name: Execute validar-local.cmd and verify HTTP
        shell: powershell
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "primecheck-local-out.log"
          $stderr = Join-Path $env:RUNNER_TEMP "primecheck-local-err.log"

          $process = Start-Process -FilePath "cmd.exe" -ArgumentList @(
            "/c",
            ".\validar-local.cmd"
          ) -WorkingDirectory "$PWD" -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru

          try {
            $ready = $false
            for ($i = 0; $i -lt 120; $i++) {
              if ($process.HasExited) {
                Get-Content $stdout -ErrorAction SilentlyContinue
                Get-Content $stderr -ErrorAction SilentlyContinue
                throw "validar-local.cmd encerrou antes de disponibilizar o PrimeCheck."
              }

              try {
                $response = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:4177/" -TimeoutSec 2 -Headers @{ "Cache-Control" = "no-cache" }
                if ($response.StatusCode -eq 200 -and $response.Content -match "PrimeCheck") {
                  $ready = $true
                  break
                }
              } catch {}

              Start-Sleep -Milliseconds 500
            }

            if (-not $ready) {
              Get-Content $stdout -ErrorAction SilentlyContinue
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw "PrimeCheck nao respondeu HTTP 200 na porta 4177."
            }

            $expectedSha = (git rev-parse HEAD).Trim()
            $buildInfoResponse = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:4177/build-info.json" -TimeoutSec 3 -Headers @{ "Cache-Control" = "no-cache" }
            $buildInfo = $buildInfoResponse.Content | ConvertFrom-Json

            if ($buildInfo.sha -ne $expectedSha) {
              throw "Preview local serviu SHA $($buildInfo.sha), esperado $expectedSha."
            }

            $versionStateResponse = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:4177/version-state.json" -TimeoutSec 3 -Headers @{ "Cache-Control" = "no-cache" }
            $versionState = $versionStateResponse.Content | ConvertFrom-Json
            $expectedProduction = (git rev-parse origin/production-release).Trim()

            if ($versionState.localSha -ne $expectedSha -or $versionState.buildSha -ne $expectedSha) {
              throw "version-state.json nao corresponde ao SHA local."
            }
            if ($versionState.productionSha -ne $expectedProduction) {
              throw "version-state.json nao corresponde ao marcador de producao."
            }
            if ($versionState.status -ne "synchronized") {
              throw "version-state.json nao esta sincronizado."
            }

            if ($response.Content -notmatch "<title>PrimeCheck \| Homologa") {
              throw "Preview local respondeu, mas o HTML nao e do PrimeCheck."
            }

            Write-Host "PrimeCheck local auditado: $expectedSha | producao: $expectedProduction | pendentes: $($versionState.pendingProduction)"
          }
          finally {
            $listeners = Get-NetTCPConnection -LocalPort 4177 -State Listen -ErrorAction SilentlyContinue
            foreach ($listener in $listeners) {
              Stop-Process -Id $listener.OwningProcess -Force -ErrorAction SilentlyContinue
            }
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
