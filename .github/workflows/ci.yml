name: PrimeCheck CI

on:
  push:
    branches: [homologacao-local-validacao, homologacao, main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and build
        run: npm run build

      - name: Verify hierarchy display
        run: npm run verify:hierarchy

      - name: Verify Product Store architecture
        run: npm run verify:product-store

      - name: Verify typography layout
        run: npm run verify:typography

      - name: Verify responsive layout
        run: npm run verify:responsive

      - name: Verify NFC-e product search filters
        run: npm run verify:nfce-short-cprod

      - name: Verify NFC-e XML tag search
        run: npm run verify:nfce-xml-search

      - name: Verify NFC-e menu label
        run: npm run verify:nfce-menu-label

      - name: Verify NFC-e formatted XML view
        run: npm run verify:nfce-xml-format

      - name: Verify build SHA and served bundle
        run: npm run verify:build-info

      - name: Verify definitive local validation flow
        run: npm run verify:local-served-script



  runtime-smoke:
    name: Exact Windows local launcher
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Execute exact PrimeCheck local launcher
        shell: powershell
        run: |
          $env:PRIMECHECK_CI = "1"
          cmd /c ".\validar-local.cmd"
          if ($LASTEXITCODE -ne 0) {
            throw "O fluxo exato validar-local.cmd -> PowerShell falhou com codigo $LASTEXITCODE."
          }

      - name: Execute final PrimeCheck server path
        shell: powershell
        run: |
          $env:PRIMECHECK_NO_OPEN = "1"
          $serverScript = Join-Path $PWD "scripts\serve-primecheck-local.ps1"

          $server = Start-Process powershell -ArgumentList @(
            "-NoProfile",
            "-ExecutionPolicy", "Bypass",
            "-File", "`"$serverScript`""
          ) -PassThru -WindowStyle Hidden

          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:4177/" -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content -match "PrimeCheck") {
                  $ready = $true
                  break
                }
              } catch {}
              Start-Sleep -Milliseconds 500
            }

            if (-not $ready) {
              throw "O servidor definitivo nao respondeu HTTP 200 na porta 4177."
            }

            $sidebar = (Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:4177/src/components/Sidebar.tsx").Content
            $analytics = (Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:4177/src/pages/NfceAnalyticsPage.tsx").Content

            if ($sidebar -notmatch "Pesquisa por produtos") {
              throw "Servidor definitivo nao entregou o menu Pesquisa por produtos."
            }
            if ($analytics -notmatch "Consulta de produtos") {
              throw "Servidor definitivo nao entregou a tela Consulta de produtos."
            }

            Write-Host "Servidor definitivo PrimeCheck OK na porta 4177."
          }
          finally {
            $listeners = Get-NetTCPConnection -LocalPort 4177 -State Listen -ErrorAction SilentlyContinue
            foreach ($listener in $listeners) {
              Stop-Process -Id $listener.OwningProcess -Force -ErrorAction SilentlyContinue
            }
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
