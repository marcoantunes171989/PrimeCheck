name: PrimeCheck CI

on:
  push:
    branches: [homologacao-local-validacao, homologacao, main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and build
        run: npm run build

      - name: Verify hierarchy display
        run: npm run verify:hierarchy

      - name: Verify Product Store architecture
        run: npm run verify:product-store

      - name: Verify typography layout
        run: npm run verify:typography

      - name: Verify responsive layout
        run: npm run verify:responsive

      - name: Verify NFC-e product search filters
        run: npm run verify:nfce-short-cprod

      - name: Verify NFC-e XML tag search
        run: npm run verify:nfce-xml-search

      - name: Verify NFC-e menu label
        run: npm run verify:nfce-menu-label

      - name: Verify NFC-e formatted XML view
        run: npm run verify:nfce-xml-format

      - name: Verify build SHA and served bundle
        run: npm run verify:build-info

      - name: Verify definitive local validation flow
        run: npm run verify:local-served-script

      - name: Verify local Vite server content
        shell: bash
        run: |
          export VITE_PRIMECHECK_SHA="$(git rev-parse HEAD)"
          npm run serve:local -- --port 4173 > /tmp/primecheck-vite.log 2>&1 &
          VITE_PID=$!
          cleanup() {
            kill "$VITE_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if node scripts/verify-local-served-build.mjs "http://localhost:4173" "$VITE_PRIMECHECK_SHA"; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/primecheck-vite.log
          exit 1


  runtime-smoke:
    name: Edge runtime smoke
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Execute PrimeCheck in Microsoft Edge
        shell: powershell
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $shortSha = $sha.Substring(0, 12)
          $env:VITE_PRIMECHECK_SHA = $sha
          $viteLog = Join-Path $env:RUNNER_TEMP "primecheck-vite.log"
          $smokeDir = Join-Path $env:RUNNER_TEMP "primecheck-edge-profile"
          $domFile = Join-Path $env:RUNNER_TEMP "primecheck-edge-dom.html"

          $launcher = Join-Path $PWD "scripts\iniciar-vite-local.cmd"
          if (-not (Test-Path $launcher)) {
            throw "Launcher do Vite não encontrado: $launcher"
          }

          $viteArgs = @(
            "/c",
            "call",
            "`"$launcher`"",
            "4173",
            "`"$sha`"",
            "`"$viteLog`""
          )
          $vite = Start-Process -FilePath "cmd.exe" -ArgumentList $viteArgs -PassThru -WindowStyle Hidden

          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing "http://localhost:4173/?smoke=$sha"
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {}
              Start-Sleep -Seconds 1
            }

            if (-not $ready) {
              Get-Content $viteLog -ErrorAction SilentlyContinue
              throw "Servidor Vite local não iniciou."
            }

            node scripts/verify-local-served-build.mjs "http://localhost:4173" "$sha"
            if ($LASTEXITCODE -ne 0) {
              throw "Fonte servida não corresponde ao SHA."
            }

            $edgeCandidates = @(
              "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
              "${env:ProgramFiles}\Microsoft\Edge\Application\msedge.exe"
            )
            $edge = $edgeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $edge) {
              throw "Microsoft Edge não encontrado no runner Windows."
            }

            $edgeError = Join-Path $env:RUNNER_TEMP "primecheck-edge-stderr.log"
            $edgeArgs = @(
              "--headless=new",
              "--disable-gpu",
              "--no-first-run",
              "--disable-extensions",
              "--user-data-dir=$smokeDir",
              "--virtual-time-budget=8000",
              "--dump-dom",
              "http://localhost:4173/?smoke=$sha"
            )
            $edgeProcess = Start-Process -FilePath $edge -ArgumentList $edgeArgs -RedirectStandardOutput $domFile -RedirectStandardError $edgeError -Wait -PassThru
            if ($edgeProcess.ExitCode -ne 0) {
              Get-Content $edgeError -ErrorAction SilentlyContinue
              throw "Microsoft Edge encerrou com código $($edgeProcess.ExitCode)."
            }

            $dom = Get-Content $domFile -Raw
            if ($dom -notmatch "PrimeCheck") { throw "PrimeCheck não apareceu no DOM." }
            if ($dom -notmatch "Processamento local") { throw "Barra local não foi montada." }
            if ($dom -notmatch [regex]::Escape($shortSha)) { throw "SHA local não apareceu no DOM." }
            if ($dom -match "data-primecheck-runtime-error") { throw "Error Boundary capturou falha de runtime." }

            Write-Host "Edge runtime smoke OK - $shortSha"
          }
          finally {
            Stop-Process -Id $vite.Id -Force -ErrorAction SilentlyContinue
          }
