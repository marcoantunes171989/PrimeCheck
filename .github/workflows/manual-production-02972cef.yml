name: PrimeCheck Manual Vercel Production Release

on:
  push:
    branches:
      - release-vercel-02972cef

permissions:
  contents: read

concurrency:
  group: primecheck-production-manual
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate main and deploy production manually
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout approved main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate approved release SHA
        shell: bash
        env:
          RELEASE_SHA: 02972cef1cc7b8e712c7e24c84ce9e38050a8b1a
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Approved SHA: $RELEASE_SHA"
          echo "Current main: $ACTUAL_SHA"
          if [[ "$ACTUAL_SHA" != "$RELEASE_SHA" ]]; then
            echo "::error::main moved after approval; deployment blocked."
            exit 1
          fi

      - name: Validate Vercel production secrets
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          for variable in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::$variable is not configured in the production environment."
              exit 1
            fi
          done
          echo "Vercel production secrets are configured."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Pull Vercel production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@59.5.0 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build approved production release
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GIT_COMMIT_SHA: 02972cef1cc7b8e712c7e24c84ce9e38050a8b1a
          VITE_PRIMECHECK_SHA: 02972cef1cc7b8e712c7e24c84ce9e38050a8b1a
        run: npx --yes vercel@59.5.0 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy approved build to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GIT_COMMIT_SHA: 02972cef1cc7b8e712c7e24c84ce9e38050a8b1a
          VITE_PRIMECHECK_SHA: 02972cef1cc7b8e712c7e24c84ce9e38050a8b1a
        run: npx --yes vercel@59.5.0 deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
