name: PrimeCheck Build Approved Production Artifact

on:
  push:
    branches:
      - release-vercel-02972cef
    paths:
      - .github/workflows/manual-production-02972cef.yml

permissions:
  contents: write

concurrency:
  group: primecheck-build-approved-02972cef
  cancel-in-progress: false

jobs:
  build:
    name: Build immutable production artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate approved main SHA
        shell: bash
        env:
          RELEASE_SHA: 02972cef1cc7b8e712c7e24c84ce9e38050a8b1a
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          ACTUAL_MAIN="$(git rev-parse origin/main)"
          echo "Approved SHA: $RELEASE_SHA"
          echo "Current main: $ACTUAL_MAIN"
          if [[ "$ACTUAL_MAIN" != "$RELEASE_SHA" ]]; then
            echo "::error::main moved after approval; artifact build blocked."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build immutable artifact
        env:
          VERCEL_GIT_COMMIT_SHA: 02972cef1cc7b8e712c7e24c84ce9e38050a8b1a
          VITE_PRIMECHECK_SHA: 02972cef1cc7b8e712c7e24c84ce9e38050a8b1a
        run: npm run build

      - name: Verify build SHA
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('dist/build-info.json','utf8')); if(x.sha!=='02972cef1cc7b8e712c7e24c84ce9e38050a8b1a') process.exit(1); console.log('Build SHA OK:',x.sha)"

      - name: Commit immutable dist to release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PrimeCheck Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f dist
          if git diff --cached --quiet; then
            echo "dist already committed."
            exit 0
          fi
          git commit -m "release: artifact 02972cef"
          git push origin HEAD:release-vercel-02972cef
